services:
  postgres:
    image: postgres:16.3-alpine3.20
    environment:
      POSTGRES_DB: denali
      POSTGRES_USER: denali
      POSTGRES_PASSWORD: denali-local
    ports:
      - "55450:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denali -d denali"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - denali-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DENALI_DSN: postgresql://denali:denali-local@postgres:5432/denali
      DENALI_AUTH_MODE: local
      DENALI_TENANT_ID: 00000000-0000-4000-8000-000000000001
      DENALI_WEB_URL: http://127.0.0.1:3080
      DENALI_AWS_ONBOARDING_BUCKET: ${DENALI_AWS_ONBOARDING_BUCKET:-}
      DENALI_AWS_PRINCIPAL_ARN: ${DENALI_AWS_PRINCIPAL_ARN:-}
      DENALI_AZURE_ONBOARDING_BUCKET: ${DENALI_AZURE_ONBOARDING_BUCKET:-}
      DENALI_AZURE_CLIENT_ID: ${DENALI_AZURE_CLIENT_ID:-}
      DENALI_AZURE_CLIENT_SECRET: ${DENALI_AZURE_CLIENT_SECRET:-}
      DENALI_AZURE_CONSENT_REDIRECT_URI: ${DENALI_AZURE_CONSENT_REDIRECT_URI:-}
      DENALI_ENTRA_CLIENT_ID: ${DENALI_ENTRA_CLIENT_ID:-}
      DENALI_ENTRA_CLIENT_SECRET: ${DENALI_ENTRA_CLIENT_SECRET:-}
      DENALI_ENTRA_CALLBACK_URL: ${DENALI_ENTRA_CALLBACK_URL:-}
      DENALI_GCP_ONBOARDING_BUCKET: ${DENALI_GCP_ONBOARDING_BUCKET:-}
      DENALI_GCP_OPERATOR_PROJECT_ID: ${DENALI_GCP_OPERATOR_PROJECT_ID:-}
      DENALI_GITHUB_APP_ID: ${DENALI_GITHUB_APP_ID:-}
      DENALI_GITHUB_CLIENT_ID: ${DENALI_GITHUB_CLIENT_ID:-}
      DENALI_GITHUB_CLIENT_SECRET: ${DENALI_GITHUB_CLIENT_SECRET:-}
      DENALI_GITHUB_APP_SLUG: ${DENALI_GITHUB_APP_SLUG:-}
      DENALI_GITHUB_PRIVATE_KEY_FILE: ${DENALI_GITHUB_PRIVATE_KEY_FILE:-}
      DENALI_GITHUB_CALLBACK_URL: ${DENALI_GITHUB_CALLBACK_URL:-}
    ports:
      - "8088:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  denali-postgres:
