[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denali-ai-security"
version = "0.1.0"
description = "Open-source AI security inventory, posture, attack paths, and runtime context"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "PyYAML>=6.0",
]

[project.scripts]
denali-db-migrate = "denali.store.cli:migrate_main"
denali-evaluate-issues = "denali.store.cli:evaluate_issues_main"
denali-evaluate-detections = "denali.store.cli:evaluate_detections_main"
denali-demo-seed = "denali.connectors.demo:seed_main"
denali-aws-scan = "denali.connectors.aws_bedrock:scan_main"
denali-aws-stack-scan = "denali.connectors.aws_stack:scan_main"
denali-aws-stack-posture = "denali.connectors.aws_stack_posture:scan_main"
denali-repository-posture = "denali.connectors.repository_posture:scan_main"
denali-code-to-cloud = "denali.connectors.code_to_cloud:scan_main"
denali-agentcore-scan = "denali.connectors.aws_agentcore:scan_main"
denali-mcp-observe = "denali.connectors.mcp_http:observe_main"
denali-ocsf-import = "denali.connectors.ocsf_findings:import_main"
denali-openshell-import = "denali.connectors.openshell:import_main"
denali-repo-scan = "denali.connectors.repository:scan_main"
denali-syft-import = "denali.connectors.syft_json:import_main"
denali-grype-import = "denali.connectors.grype_json:import_main"
denali-activity-import = "denali.connectors.activity_json:import_main"
denali-aws-runtime = "denali.connectors.aws_bedrock_activity:scan_main"
denali-gcp-vertex-runtime = "denali.connectors.gcp_vertex_activity:scan_main"
denali-gcp-deployments-scan = "denali.connectors.gcp_deployments:scan_main"
denali-golden-path = "denali.golden_path:main"
denali-kubernetes-import = "denali.connectors.kubernetes:import_main"
denali-entra-scan = "denali.connectors.entra_ai:scan_main"

[project.optional-dependencies]
api = [
  "clerk-backend-api>=6.0.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
aws = [
  "boto3>=1.43.9",
]
azure = [
  "azure-identity>=1.17",
]
gcp = [
  "google-auth>=2.35",
  "google-cloud-logging>=3.12",
]
github = [
  "PyJWT[crypto]>=2.9",
]
hosted = [
  "modal>=1.1",
]
dev = [
  "pytest>=8",
  "PyYAML>=6",
  "ruff>=0.6",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"denali.store" = ["migrations/*.sql"]
"denali.connectors" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
