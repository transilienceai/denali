name: Platform feature delivery

on:
  pull_request:

permissions:
  contents: read

jobs:
  platform_delivery:
    name: Platform delivery evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Apply the reviewed base checker before proposed gate changes
        env:
          PLATFORM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$PLATFORM_BASE_SHA:scripts/check_platform_delivery.py" > "$RUNNER_TEMP/platform-delivery-base.py"
          python "$RUNNER_TEMP/platform-delivery-base.py" --self-test
          python "$RUNNER_TEMP/platform-delivery-base.py" --base "$PLATFORM_BASE_SHA"
      - name: Test the offline policy gate
        run: python scripts/check_platform_delivery.py --self-test
      - name: Require an explicit integration decision for changed features
        env:
          PLATFORM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_platform_delivery.py --base "$PLATFORM_BASE_SHA"
