name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.3-alpine3.20
        env:
          POSTGRES_DB: denali_test
          POSTGRES_USER: denali
          POSTGRES_PASSWORD: denali-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denali -d denali_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DENALI_TEST_DSN: postgresql://denali:denali-test@127.0.0.1:5432/denali_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[api,aws,azure,gcp,github,hosted,dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m py_compile modal_app.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
